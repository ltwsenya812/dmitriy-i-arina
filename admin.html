<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Гости · Дмитрий & Арина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column; login card → summary tiles → filters → guest list */
:root{
  --night:#0d1636; --night2:#1b2a5e; --peri:#7088c8; --ice:#e3ebff; --gold:#e8c46c; --gold2:#b88a2e;
  --paper:#f7f3ea; --card:#fffdf8; --ink:#232842; --muted:#6b7090; --line:#e4dfd2;
  --yes:#2f7a55; --yes-bg:#e3f2ea; --no:#a2403b; --no-bg:#f8e6e4;
  --display:"Cormorant Garamond",Georgia,serif; --ui:"Manrope",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1430;--card:#161e42;--ink:#e6eaff;--muted:#9aa3c9;--line:#2a3463;--yes:#7fd3a6;--yes-bg:#163a2b;--no:#f0a29b;--no-bg:#3d1d22;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1430;--card:#161e42;--ink:#e6eaff;--muted:#9aa3c9;--line:#2a3463;--yes:#7fd3a6;--yes-bg:#163a2b;--no:#f0a29b;--no-bg:#3d1d22;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui)}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font:600 clamp(30px,6vw,40px)/1.05 var(--display);margin:0;letter-spacing:.01em}
h1 span{color:var(--gold2);font-style:italic;font-weight:400}
.sub{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.btn{font:600 14px var(--ui);border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--peri)}
.btn.primary{background:var(--night2);color:#fff;border-color:var(--night2)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
/* login */
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login h1{margin-bottom:6px}
.login form{display:grid;gap:12px;margin-top:20px}
input[type=password],input[type=search]{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.err{color:var(--no);font-size:14px;min-height:1.4em}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.tile{padding:16px 18px}
.tile b{display:block;font:600 clamp(34px,7vw,46px)/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.yes b{color:var(--yes)} .tile.no b{color:var(--no)}
.drinks{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:22px;font-size:14px}
.drinks .lbl{color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
/* toolbar */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{font:500 14px var(--ui);border:0;background:none;color:var(--muted);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--night2);color:#fff}
.bar input[type=search]{flex:1 1 200px;min-width:0;padding:8px 12px}
/* list */
.list{padding:0;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1.4fr) auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .dr{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row .tm{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.yes{background:var(--yes-bg);color:var(--yes)} .pill.no{background:var(--no-bg);color:var(--no)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}
.del:hover{color:var(--no);background:var(--no-bg)}
.del.arm{color:#fff;background:var(--no);font-size:12px;font-weight:600}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:12px}
@media (max-width:620px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{padding:12px}
  .row{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"nm pill del" "dr dr tm";gap:4px 10px;padding:12px 14px}
  .row .nm{grid-area:nm}.row .pill{grid-area:pill}.row .dr{grid-area:dr}.row .tm{grid-area:tm;text-align:right}.row .del{grid-area:del}
}
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="card login">
    <h1>Гости <span>свадьбы</span></h1>
    <p class="sub">Дмитрий &amp; Арина · 31.07.2027</p>
    <form id="lf">
      <label for="pw" class="sub" style="text-align:left;margin:0">Пароль</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn primary" type="submit">Войти</button>
      <div class="err" id="lerr" role="alert"></div>
    </form>
  </section>

  <section id="app" hidden>
    <header>
      <div><h1>Гости <span>свадьбы</span></h1><div class="sub" id="updated">Дмитрий &amp; Арина · 31.07.2027</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="refresh" type="button">Обновить</button>
        <button class="btn" id="csv" type="button">Скачать CSV</button>
        <button class="btn" id="logout" type="button">Выйти</button>
      </div>
    </header>

    <div class="tiles">
      <div class="card tile yes"><b id="cYes">0</b><span>придут</span></div>
      <div class="card tile no"><b id="cNo">0</b><span>не смогут</span></div>
      <div class="card tile"><b id="cAll">0</b><span>всего ответов</span></div>
    </div>
    <div class="drinks" id="drinks"></div>

    <div class="bar">
      <div class="seg" role="group" aria-label="Фильтр">
        <button type="button" data-f="all" aria-pressed="true">Все</button>
        <button type="button" data-f="yes" aria-pressed="false">Придут</button>
        <button type="button" data-f="no" aria-pressed="false">Не смогут</button>
      </div>
      <input id="q" type="search" placeholder="Поиск по имени" aria-label="Поиск по имени">
    </div>
    <div class="card list" id="list"></div>
    <div class="foot"><span id="shown"></span><span>Ответы приходят из анкеты на сайте приглашения</span></div>
  </section>

</div>
<script>
(function(){
  var DRINKS=['Вино','Шампанское','Крепкие напитки','Без алкоголя'];
  var api=null, pass='', rows=[], filter='all';
  var $=function(id){return document.getElementById(id)};

  // Адрес базы берём из index.html (строка RSVP_URL), чтобы не хранить его в двух местах.
  function loadConfig(){
    return fetch('index.html',{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/var RSVP_URL='([^']*)'/);
      if(!m||!m[1])throw new Error('cfg');
      var u=new URL(m[1]);api={base:u.origin,key:u.searchParams.get('apikey')};
    });
  }
  function rpc(fn,body){
    return fetch(api.base+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':api.key,'Authorization':'Bearer '+api.key,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j&&j.message||'error');e.status=r.status;throw e}return j})});
  }
  function fmt(d){d=new Date(d);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function render(){
    var yes=rows.filter(function(r){return r.attend}),no=rows.length-yes.length;
    $('cYes').textContent=yes.length;$('cNo').textContent=no;$('cAll').textContent=rows.length;
    $('drinks').innerHTML='<span class="lbl">Напитки среди тех, кто придёт:</span>'+DRINKS.map(function(d){
      var n=yes.filter(function(r){return (r.drinks||'').indexOf(d)>-1}).length;return '<span class="chip">'+d+' <b>'+n+'</b></span>'}).join('');
    var q=$('q').value.trim().toLowerCase().replace(/ё/g,'е');
    var list=rows.filter(function(r){return (filter==='all'||(filter==='yes')===r.attend)&&(!q||r.name.toLowerCase().replace(/ё/g,'е').indexOf(q)>-1)});
    $('list').innerHTML=list.length?list.map(function(r){
      return '<div class="row"><div class="nm">'+esc(r.name)+'</div><span class="pill '+(r.attend?'yes">Придёт':'no">Не сможет')+'</span><div class="dr">'+(esc(r.drinks)||'—')+'</div><div class="tm">'+fmt(r.updated_at)+'</div><button class="del" type="button" data-id="'+r.id+'" aria-label="Удалить ответ '+esc(r.name)+'">×</button></div>'}).join('')
      :'<div class="empty">'+(rows.length?'Никого не нашлось':'Пока никто не ответил. Как только гость заполнит анкету, он появится здесь.')+'</div>';
    $('shown').textContent=list.length===rows.length?'':'Показано '+list.length+' из '+rows.length;
    $('updated').textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  }
  function load(){
    return rpc('admin_rsvps',{pass:pass}).then(function(d){rows=d;render()});
  }
  function showApp(){$('login').hidden=true;$('app').hidden=false}
  function login(p){
    pass=p;$('lerr').textContent='';
    return load().then(function(){try{sessionStorage.setItem('adm',p)}catch(e){}showApp()}).catch(function(e){
      try{sessionStorage.removeItem('adm')}catch(x){}
      $('login').hidden=false;$('app').hidden=true;
      $('lerr').textContent=e.status===400||/password/i.test(e.message)?'Неверный пароль':'Не удалось связаться с базой. Попробуйте ещё раз.';
    });
  }

  $('lf').addEventListener('submit',function(e){e.preventDefault();var b=e.target.querySelector('button');b.disabled=true;
    (api?Promise.resolve():loadConfig()).then(function(){return login($('pw').value)}).catch(function(){$('lerr').textContent='Анкета ещё не подключена к базе: в index.html пустой RSVP_URL.'}).then(function(){b.disabled=false})});
  $('refresh').addEventListener('click',function(){load().catch(function(){})});
  $('logout').addEventListener('click',function(){try{sessionStorage.removeItem('adm')}catch(e){}pass='';rows=[];$('pw').value='';$('app').hidden=true;$('login').hidden=false});
  $('q').addEventListener('input',render);
  document.querySelector('.seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filter=b.dataset.f;
    [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)});render()});
  $('list').addEventListener('click',function(e){var b=e.target.closest('.del');if(!b)return;
    if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Удалить?';setTimeout(function(){if(b.isConnected){b.classList.remove('arm');b.textContent='×'}},3000);return}
    rpc('admin_delete',{pass:pass,rid:+b.dataset.id}).then(load).catch(function(){alert('Не удалось удалить')})});
  $('csv').addEventListener('click',function(){
    var lines=[['Имя','Придёт','Напитки','Когда ответил']].concat(rows.map(function(r){return [r.name,r.attend?'Да':'Нет',r.drinks||'',fmt(r.updated_at)]}));
    var csv='﻿'+lines.map(function(l){return l.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='gosti.csv';a.click();});
  setInterval(function(){if(pass&&!document.hidden)load().catch(function(){})},60000);

  var saved=null;try{saved=sessionStorage.getItem('adm')}catch(e){}
  if(saved)loadConfig().then(function(){return login(saved)}).catch(function(){});
})();
</script>
</body>
</html>
